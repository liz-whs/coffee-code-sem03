<!doctype html>
<html lang="pt-br" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Estom</title>

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- ==================== Navbar ==================== -->
    <header class="header">
      <div class="container header-content">
        <a href="index.html" class="logo">Estom</a>
        <nav class="navigation" aria-label="Navegação principal">
          <a href="index.html" class="nav-link active"> Meus Produtos </a>
          <a href="perfil.html" class="nav-link active"> Perfil </a>
          <a href="login.html" class="nav-login"> Entrar </a>
          <button
            class="theme-button"
            id="theme-button"
            type="button"
            aria-label="Alterar tema"
          >
            ☾
          </button>
        </nav>
      </div>
    </header>
    <!-- ==================== Main ==================== -->

    <main class="main">
      <div class="container">
        <!-- Cabeçalho da página -->
        <section class="products-header">
          <div>
            <h1>Meus Produtos</h1>
            <p>Acompanhe os preços dos seus produtos em um só lugar.</p>
          </div>
          <button class="button button-primary" id="open-modal">
            + Adicionar produto
          </button>
        </section>
        <input
            class="product-search"
            type="search"
            id="product-search"
            placeholder="Buscar produto..."
            aria-label="Buscar produto"
        />
        <!-- ==================== Produtos ==================== -->

        <section class="products-section">
          <div class="products-grid">
            <!-- Os cards serão renderizados pelo JavaScript -->
          </div>
        </section>
      </div>
    </main>
    <!-- ==================== Modal Adicionar Produto ==================== -->

    <div class="modal-overlay" id="add-product-modal">
      <div class="modal">
        <div class="modal-header">
          <div>
            <h2>Adicionar Produto</h2>
            <p>Cadastre um produto para acompanhar seu preço.</p>
          </div>

          <button
            class="modal-close"
            id="close-modal"
            type="button"
            aria-label="Fechar"
          >
            ×
          </button>
        </div>

        <div id="form-error"></div>

        <form class="product-form">
          <div class="form-group">
            <label for="product-name">Nome</label>

            <input
              type="text"
              id="product-name"
              placeholder="Ex: Monitor Samsung Odyssey G5"
              required
            />
          </div>

          <div class="form-group">
            <label for="product-url">URL do produto</label>

            <input
              type="url"
              id="product-url"
              placeholder="https://mercadolivre.com.br/..."
              required
            />
          </div>

          <div class="form-group">
            <label for="target-price">
              Preço máximo
              <span class="optional">(opcional)</span>
            </label>

            <input
              type="number"
              id="target-price"
              placeholder="0,00"
              min="0"
              step="0.01"
            />

            <small class="form-help">
              Sem uma meta, o produto continuará sendo monitorado, mas não
              gerará alertas de preço.
            </small>
          </div>

          <div class="form-actions">
            <button
              class="button button-secondary"
              id="cancel-modal"
              type="button"
            >
              Cancelar
            </button>

            <button class="button button-primary" type="submit">
              + Adicionar produto
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="assets/js/script.js"></script>
  </body>
</html>
