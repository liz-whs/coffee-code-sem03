<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Criar conta</h1>
            <p>O propósito dessa tela é para criar sua conta no sistema..</p>
        </header>
        <main>
            <form>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu Nome Completo" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="nome@email.com" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="suasenha123" required>

                <button type="submit">Criar Conta</button>
            </form>
            <a href="login.html">Já tem uma conta? Faça login aqui.</a>
        </main>
    </body>
</html>
